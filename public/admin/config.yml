# yaml-language-server: $schema=https://cdn.jsdelivr.net/npm/@sveltia/cms/schema/sveltia-cms.json
#
# Sveltia CMS: het bewerkscherm van dhr. Omer, op /admin/.
#
# Sveltia leest dit bestand uit de repo en bouwt daar het bewerkscherm van. Het
# bewerkt dezelfde Markdown-bestanden die `npm run build` leest: geen database,
# geen tweede kopie. Elke klik van Omer wordt een commit in deze repo, en
# Cloudflare Pages bouwt die binnen twee minuten opnieuw. Zo ziet de voorzitter
# elke wijziging in de geschiedenis staan.
#
# De labels staan in het Turks: dat is de taal van wie dit scherm gebruikt. De
# veldnamen zelf zijn Engels, net als de rest van de code.
#
# Inloggen werkt vandaag via "Sign in with token": een fine-grained GitHub-token
# met Contents read/write op hisarweb-be/uccib. Dat vraagt geen server en geen
# tweede account. De knop "Sign in with GitHub" komt erbij zodra de Sveltia CMS
# Authenticator op Cloudflare Workers Free staat; pas dan komt hier base_url bij.
#
# Waarom create/delete op false: de site heeft veertien vaste pagina's, elk met
# een eigen plek in de menubalk en een eigen ontworpen kop. Een vijftiende pagina
# erbij is een ontwerpbeslissing (menunaam in drie talen, kop, beeld), geen
# schakelaar. Wat Omer wel zelf doet: de vier lege pagina's vullen en op actief
# zetten.

backend:
  name: github
  repo: hisarweb-be/uccib
  branch: main

media_folder: public/beeld
public_folder: /beeld

# Zolang uccib.com nog de oude WordPress-site is, wijzen deze drie naar het
# adres waar de site en dit bewerkscherm echt staan. uccib.com heeft `/beeld/`
# niet, dus een logo_url daar levert een gebroken beeld op in het bewerkscherm.
# Zodra het domein om is (F6), gaan deze drie regels in één keer mee.
site_url: https://uccib.pages.dev
display_url: https://uccib.pages.dev
logo_url: https://uccib.pages.dev/beeld/logo/uccib-vierkant/512.webp

i18n:
  structure: multiple_folders
  locales: [tr, nl, fr]
  default_locale: tr

collections:
  - name: paginas
    label: Sayfalar
    label_singular: Sayfa
    folder: src/content/paginas
    extension: md
    format: frontmatter
    i18n: true
    create: false
    delete: false
    identifier_field: title
    summary: "{{title}} · {{order}}"
    sortable_fields: [order, title]
    view_filters:
      - { label: Yayında, field: active, eq: true }
      - { label: "Kapalı (pasif)", field: active, eq: false }
    fields:
      - { name: title, label: Sekme başlığı, widget: string }
      - { name: h1, label: Sayfanın büyük başlığı, widget: string }
      - { name: description, label: Google için açıklama, widget: text, required: false }
      - { name: intro, label: Giriş metni (boş bırakılabilir), widget: text, required: false }
      - { name: order, label: Sıra numarası, widget: number, default: 0, i18n: duplicate }
      - { name: active, label: "Yayında (geldt voor alle drie de talen)", widget: boolean, default: true, i18n: duplicate }
      - { name: body, label: Sayfa içeriği, widget: markdown }

  - name: sponsorblokken
    label: Bağış tutarları
    label_singular: Bağış tutarı
    folder: src/content/sponsorblokken
    extension: md
    format: frontmatter
    create: false
    delete: false
    identifier_field: label
    summary: "{{label}}"
    sortable_fields: [order, amount]
    fields:
      - { name: amount, label: "Tutar (€, boş = serbest tutar)", widget: number, required: false }
      - { name: label, label: Düğmede görünen yazı, widget: string }
      - { name: link, label: Mollie ödeme bağlantısı, widget: string }
      - { name: order, label: Sıra numarası, widget: number, default: 0 }
      - { name: active, label: Yayında, widget: boolean, default: true }

  # ---------------------------------------------------------------------------
  # De vier ledendiensten. Hier mag Omer wél regels toevoegen en verwijderen:
  # een nieuwe vestiging, een nieuwe maand, een nieuwe preek is inhoud en geen
  # ontwerpbeslissing. Daarom staat `create` en `delete` hier op true.
  #
  # De velden staan in één taal: een naam, een adres en een telefoonnummer zijn
  # eigennamen. De kop boven de lijst komt uit de vertaling van de pagina zelf.
  # ---------------------------------------------------------------------------

  - name: subeler
    label: Şubeler (vestigingen)
    label_singular: Şube
    folder: src/content/subeler
    extension: md
    format: frontmatter
    create: true
    delete: true
    identifier_field: name
    summary: "{{name}} · {{city}}"
    sortable_fields: [order, name]
    fields:
      - { name: name, label: Şubenin adı, widget: string }
      - { name: street, label: Sokak ve numara, widget: string, required: false }
      - { name: postalCode, label: Posta kodu, widget: string, required: false }
      - { name: city, label: Şehir, widget: string, required: false }
      - { name: phone, label: Telefon, widget: string, required: false }
      - { name: email, label: E-posta, widget: string, required: false }
      - { name: openingHours, label: "Açılış saatleri (serbest metin)", widget: string, required: false }
      - { name: photo, label: Fotoğraf, widget: image, required: false, media_folder: public/beeld, public_folder: /beeld }
      - { name: order, label: Sıra numarası, widget: number, default: 0 }
      - { name: active, label: Yayında, widget: boolean, default: true }

  - name: dernekler
    label: Bölge dernekleri (regionale verenigingen)
    label_singular: Bölge derneği
    folder: src/content/dernekler
    extension: md
    format: frontmatter
    create: true
    delete: true
    identifier_field: name
    summary: "{{name}} · {{region}}"
    sortable_fields: [order, name]
    fields:
      - { name: name, label: Derneğin adı, widget: string }
      - { name: region, label: Bölge veya şehir, widget: string, required: false }
      - { name: description, label: Kısa tanıtım, widget: text, required: false }
      - { name: contact, label: İlgili kişi, widget: string, required: false }
      - { name: phone, label: Telefon, widget: string, required: false }
      - { name: email, label: E-posta, widget: string, required: false }
      - { name: website, label: "Web sitesi (https:// ile)", widget: string, required: false }
      - { name: photo, label: Fotoğraf, widget: image, required: false, media_folder: public/beeld, public_folder: /beeld }
      - { name: order, label: Sıra numarası, widget: number, default: 0 }
      - { name: active, label: Yayında, widget: boolean, default: true }

  - name: vakitler
    label: Namaz vakitleri (gebedstijden)
    label_singular: Aylık vakit çizelgesi
    folder: src/content/vakitler
    extension: md
    format: frontmatter
    create: true
    delete: true
    identifier_field: month
    summary: "{{month}} · {{place}}"
    sortable_fields: [month, place]
    fields:
      - { name: month, label: "Ay (YYYY-AA, örnek 2026-11)", widget: string }
      - { name: place, label: Yer veya cami, widget: string }
      - { name: source, label: "Kaynak (isteğe bağlı bağlantı)", widget: string, required: false }
      - { name: body, label: "Çizelge (tablo)", widget: markdown }
      - { name: order, label: Sıra numarası, widget: number, default: 0 }
      - { name: active, label: Yayında, widget: boolean, default: true }

  - name: hutbeler
    label: Cuma hutbeleri (preekarchief)
    label_singular: Cuma hutbesi
    folder: src/content/hutbeler
    extension: md
    format: frontmatter
    create: true
    delete: true
    identifier_field: title
    summary: "{{title}} · {{date}}"
    sortable_fields: [date, title]
    fields:
      - { name: title, label: Hutbenin başlığı, widget: string }
      - { name: date, label: Tarih, widget: datetime, date_format: "DD.MM.YYYY", time_format: false, format: "YYYY-MM-DD" }
      - { name: imam, label: İmam veya konuşmacı, widget: string, required: false }
      - { name: language, label: "Dil (örnek Türkçe)", widget: string, required: false }
      - { name: file, label: "PDF", widget: file, required: false, media_folder: public/beeld, public_folder: /beeld }
      - { name: body, label: Hutbe metni, widget: markdown, required: false }
      - { name: order, label: Sıra numarası, widget: number, default: 0 }
      - { name: active, label: Yayında, widget: boolean, default: true }

  # Eén bestand met de wettelijke gegevens van de vereniging. Een leeg veld
  # verschijnt nergens op de site; vul alleen wat de raad van bestuur bevestigt.
  - name: kerngegevens
    label: Kerngegevens
    i18n: false
    files:
      - name: kerngegevens
        label: "Kerngegevens (KBO, hukuki şekil, merkez, saatler)"
        file: src/data/kerngegevens.json
        format: json
        fields:
          - { name: openingsuren, label: Açılış saatleri, widget: text, required: false }
          - { name: kbo, label: "KBO numarası (örnek 0123.456.789)", widget: string, required: false }
          - { name: naam, label: Resmî ad, widget: string, required: false }
          - { name: afkorting, label: Kısaltma, widget: string, required: false }
          - { name: rechtsvorm, label: Hukuki şekil (Felemenkçe), widget: string, required: false }
          - { name: rechtsvormFr, label: Hukuki şekil (Fransızca), widget: string, required: false }
          - { name: zetel, label: Merkez adresi (Felemenkçe), widget: string, required: false }
          - { name: zetelFr, label: Merkez adresi (Fransızca), widget: string, required: false }
          - { name: lat, label: Enlem, widget: number, value_type: float, required: false }
          - { name: lng, label: Boylam, widget: number, value_type: float, required: false }
