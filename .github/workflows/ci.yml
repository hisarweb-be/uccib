name: CI

on:
  push:
    branches: [main, herontwerp-wow]
  pull_request:
    branches: [main, herontwerp-wow]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bouw-en-keur:
    name: Bouwen en keuren
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Ophalen
        uses: actions/checkout@v4
        with:
          # verify:betaallinks vergelijkt met origin/main en heeft die ref nodig.
          fetch-depth: 0

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Afhankelijkheden
        run: npm ci

      - name: Browser voor de keuring
        run: npx playwright install --with-deps chromium

      - name: Typen en sjablonen
        run: npm run check

      - name: Bouwen
        run: npm run build

      - name: Keuren per pagina
        run: npm run verify:elke

      - name: Inhoud en 404
        run: npm run verify

      - name: Linkcontrole
        run: npm run verify:links

      - name: Server en paden
        run: npm run verify:server

      - name: Betaallinks gelijk aan main
        run: npm run verify:betaallinks

      - name: Menu met acht punten
        run: npm run verify:menu
      # Het bewerkscherm: vaste Sveltia-versie, integrity-hash, en een base_url
      # die naar de authenticator wijst. Zonder deze stap kan iemand de
      # integrity-hash of de base_url breken zonder dat er iets rood wordt.
      - name: Bewerkscherm en authenticator
        run: npm run verify:cms

      - name: Schermafbeeldingen bewaren
        run: echo "UCCIB_BEELD=$RUNNER_TEMP/uccib-beeld" >> "$GITHUB_ENV"

      - name: Eerste scherm in pixels
        run: npm run verify:scherm

      - name: Leeg scherm, witte ster en tweede posterlaag
        run: npm run verify:leeg

      - name: Mobiel met een echte vinger
        run: npm run verify:mobiel

      - name: Bewijs van de schermkeuring bewaren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schermafbeeldingen
          path: ${{ runner.temp }}/uccib-beeld
          retention-days: 7
          if-no-files-found: ignore

      - name: Bewijs bewaren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
          if-no-files-found: ignore
