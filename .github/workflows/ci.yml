name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bouw-en-keur:
    name: Bouwen en keuren
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Ophalen
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Afhankelijkheden
        run: npm ci

      - name: Browser voor de keuring
        run: npx playwright install --with-deps chromium

      - name: Typen en sjablonen
        run: npm run check

      - name: Bouwen
        run: npm run build

      - name: Keuren per pagina
        run: npm run verify:elke

      - name: Inhoud en 404
        run: npm run verify

      - name: Linkcontrole
        run: npm run verify:links

      - name: Server en paden
        run: npm run verify:server

      - name: Schermafbeeldingen bewaren
        run: echo "UCCIB_BEELD=$RUNNER_TEMP/uccib-beeld" >> "$GITHUB_ENV"

      - name: Eerste scherm in pixels
        run: npm run verify:scherm

      - name: Mobiel met een echte vinger
        run: npm run verify:mobiel

      - name: Bewijs van de schermkeuring bewaren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schermafbeeldingen
          path: ${{ runner.temp }}/uccib-beeld
          retention-days: 7
          if-no-files-found: ignore

      - name: Bewijs bewaren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
          if-no-files-found: ignore
